name: MEG-M1-Score-Polygen-2026 
# d'après l'env `tMEG-M1-A2B-2026`
# adapté de Scaburet/template-R-SC-2026, qui est le template ok pour avoir Rstudio sur uracile après maj Plasma
# Ajout des outils python utilisés pour les TP de Score Polygenique du M1 MEG - UPC
# 06/10/2026

channels:
  - conda-forge
  - bioconda
  - nodefaults
  
dependencies:
  # Jupyter dependencies
  - jupyterhub>=4.1,<5
  - jupyterlab>=4.0,<5
  - notebook>=7,<8
  - jupyter_server>=2,<3
  - jupyter-server-proxy>=4.1,<4.2
  - jupyter-resource-usage
  - jupyterlab-topbar-text    # affiche le nom de l'environnement à droite dans la topbar
  - nodejs
  - nbresuse
  - libgomp
  
  # Jupyter archive
  # https://github.com/jupyterlab-contrib/jupyter-archive
  - jupyter-archive
  # JupyterLab git
  # https://github.com/jupyterlab/jupyterlab-git
  - jupyterlab-git

  # Bash environment
  - bash_kernel

  # RStudio proxy (nécessaire pour afficher RStudio dans JupyterLab)
  - jupyter-rsession-proxy==2.3.0   
  
  # Python environment
  - python=3.10
  - pip
  - pip:
    - watermark
    # - man-db

  # For the M1 Polygen course (python part)
  - matplotlib==3.8.4
  - numpy==1.26.4
  - pandas=2=.3.1
  - pyarrow==21.0.0
  - pybedtools==0.11.0
  - pysam=0=.22.1
  - rpy2==3.6.4
  - scikit-allel==1.3.8
  - scipy==1.13.1
  - seaborn==0.13.2
  - statsmodels==0.14.5
  - statannotations>=0.4.2
  #- gwaslab=3.6.8
  #- ldsc=2.0.1
  - pip:
    - gwaslab==3.6.8
    - ldsc==2.0.1




